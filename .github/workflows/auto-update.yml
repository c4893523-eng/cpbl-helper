name: Auto Update CPBL Data

on:
  schedule:
    # 每天台灣時間凌晨 02:00 (UTC 18:00) 執行
    - cron: '0 18 * * *'
    # 台灣時間 17:07 ~ 23:52 每 15 分鐘同步；避開整點，降低 GitHub 排程延遲或略過的機率。
    # (台北時間 UTC+8；對應 UTC 09:07 ~ 15:52)
    - cron: '7,22,37,52 9-15 * * *'
    # 台灣時間 00:12 賽後補抓，涵蓋延長賽與晚到的官方結算。
    - cron: '12 16 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動觸發

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run data fetch script
        run: node scripts/update_data.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add schedule.json standings.json news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CPBL data (schedule, standings, news)" && git push)
